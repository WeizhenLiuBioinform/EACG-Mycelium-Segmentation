[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eacg-mmseg"
version = "0.1.0"
description = "EACG models, losses and data transforms for MMSegmentation"
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["eacg*"]
